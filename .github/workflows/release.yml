name: release

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the validated package to npm
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: npm pack --dry-run

  binaries:
    needs: check
    strategy:
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-x64-baseline
          - bun-linux-arm64
          - bun-windows-x64-baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build-release.ts ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: find artifacts -type f -name 'skillbench-*' -exec cp {} . \;
      - run: sha256sum skillbench-* > SHA256SUMS
      - run: gh release create "${GITHUB_REF_NAME}" skillbench-* SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
